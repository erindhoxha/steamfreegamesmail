name: Check Steam free games

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steam-free-games-state
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Mailjet settings are only used when a game ends before the 17:00 digest (urgent draft).
    env:
      MJ_APIKEY_PUBLIC: ${{ secrets.MJ_APIKEY_PUBLIC }}
      MJ_APIKEY_PRIVATE: ${{ secrets.MJ_APIKEY_PRIVATE }}
      MJ_CONTACT_LIST_ID: ${{ vars.MJ_CONTACT_LIST_ID }}
      MJ_FROM_EMAIL: ${{ vars.MJ_FROM_EMAIL }}
      MJ_FROM_NAME: ${{ vars.MJ_FROM_NAME }}
      TEST_RECIPIENT: ${{ vars.TEST_RECIPIENT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check for free games
        run: node server/check-free-games.js

      - name: Commit state
        run: |
          set -euo pipefail
          if git diff --quiet -- data; then
            echo "No state change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: update free game state"
          git pull --rebase --autostash
          git push
