name: Draft Steam digest

# Creates a Mailjet campaign draft from the pending queue and emails a test copy for review.
# Nothing reaches subscribers until the draft is sent by hand in Mailjet.
# GitHub cron is UTC only, and scheduled runs often start hours late. So this runs
# hourly through the evening and draft-digest.js makes one draft per day, on the first
# run at or after 17:00 Europe/Berlin.
on:
  schedule:
    - cron: "5 15-21 * * *" # 16:05-22:05 CET / 17:05-23:05 CEST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steam-free-games-state
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      MJ_APIKEY_PUBLIC: ${{ secrets.MJ_APIKEY_PUBLIC }}
      MJ_APIKEY_PRIVATE: ${{ secrets.MJ_APIKEY_PRIVATE }}
      MJ_CONTACT_LIST_ID: ${{ vars.MJ_CONTACT_LIST_ID }}
      MJ_FROM_EMAIL: ${{ vars.MJ_FROM_EMAIL }}
      MJ_FROM_NAME: ${{ vars.MJ_FROM_NAME }}
      TEST_RECIPIENT: ${{ vars.TEST_RECIPIENT }}
      FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create draft and send test copy
        run: node server/draft-digest.js

      - name: Commit state
        run: |
          set -euo pipefail
          if git diff --quiet -- data; then
            echo "No state change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: mark drafted games as seen"
          git pull --rebase --autostash
          git push
